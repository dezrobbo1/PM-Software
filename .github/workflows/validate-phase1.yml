name: Validate Phase 1 reference prototype

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase1-validation:
    name: phase1-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/phase1-ci.lock
      - name: Install hash-locked dependency environment
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements/phase1-ci.lock'
      - name: Install repository package without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Run Phase 0 and Phase 1 tests
        run: python -m unittest discover -s tests -v
      - name: Preserve the frozen Phase 0 gate
        run: python tools/validate_phase0.py
      - name: Validate Phase 1 evidence and governance contracts
        run: python tools/validate_phase1_governance.py
      - name: Execute the frozen semantic suite
        run: python -m deterministic_scheduling_core run-semantic-suite
      - name: Compile Python sources
        run: python -m compileall -q src tools tests
      - name: Check patch whitespace and tracked-tree cleanliness
        run: |
          git diff --check
          test -z "$(git status --short --untracked-files=all)"
