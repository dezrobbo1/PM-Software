name: Validate Phase 1 reference prototype

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase1-validation:
    name: phase1-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/phase1-ci.lock
      - name: Install hash-locked dependency environment
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements/phase1-ci.lock'
      - name: Install repository package without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Run Phase 0 and Phase 1 tests
        run: python -m unittest discover -s tests -v
      - name: Preserve the frozen Phase 0 gate
        run: python tools/validate_phase0.py
      - name: Validate Phase 1 evidence and governance contracts
        run: python tools/validate_phase1_governance.py
      - name: Execute the frozen semantic suite
        run: python -m deterministic_scheduling_core run-semantic-suite
      - name: Regenerate and verify the non-executed Microsoft Project pilot kit
        run: |
          python -m deterministic_scheduling_core prepare-msproject-relationship-pilot
          python -m deterministic_scheduling_core verify-msproject-relationship-pilot
      - name: Compile Python sources
        run: python -m compileall -q src tools tests
      - name: Check patch whitespace and tracked-tree cleanliness
        run: |
          git diff --check
          test -z "$(git status --short --untracked-files=all)"

  msproject-windows-smoke:
    name: msproject-windows-smoke
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Fetch the exact workflow commit without an additional action
        shell: pwsh
        run: |
          git init .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
      - name: Install exact native-tool smoke dependencies
        shell: pwsh
        run: py -3.12 -m pip install attrs==26.1.0 jsonschema==4.26.0 jsonschema-specifications==2025.9.1 referencing==0.37.0 rfc3339-validator==0.1.4 rpds-py==2026.6.3 setuptools==80.9.0 six==1.17.0 typing-extensions==4.16.0
      - name: Install repository package without dependency resolution
        shell: pwsh
        run: py -3.12 -m pip install --no-deps --no-build-isolation -e .
      - name: Exercise fail-closed headless COM orchestration with fakes
        shell: pwsh
        run: py -3.12 -m unittest tests.phase1.unit.test_msproject_headless_characterisation tests.phase1.unit.test_msproject_headless_runner_hardening -v
      - name: Exercise the Windows write-through durability boundary
        shell: pwsh
        run: py -3.12 tests/windows_native_smoke.py
