name: Canonical block proof boundary and solver-call overhead

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: block-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact source
        run: |
          mkdir -p /tmp/block-boundary
          git rev-parse HEAD > /tmp/block-boundary/source-sha.txt
      - name: Install bounded scheduler
        run: python -m pip install -e .
      - name: Focused boundary tests
        env:
          PYTHONHASHSEED: '0'
        run: |
          set -euo pipefail
          python -m unittest tests.test_block000_boundary_experiment -v 2>&1 | tee /tmp/block-boundary/focused-tests.txt
      - name: Source-bound result
        env:
          PYTHONHASHSEED: '0'
        run: |
          python -m deterministic_scheduling_core.block000_boundary_experiment --source-sha "$(git rev-parse HEAD)" --output /tmp/block-boundary/result.json
          python -c 'import json,subprocess; d=json.load(open("/tmp/block-boundary/result.json")); assert d["source_sha"] == subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()'
      - name: Digest available evidence
        if: always()
        run: |
          cd /tmp/block-boundary
          : > SHA256SUMS
          for file in source-sha.txt focused-tests.txt result.json; do
            if [ -f "$file" ]; then sha256sum "$file" >> SHA256SUMS; fi
          done
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block-boundary-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/block-boundary/
          if-no-files-found: warn
