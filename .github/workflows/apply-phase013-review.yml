name: Apply Phase 0.1.3 review corrections

on:
  push:
    branches:
      - phase0-protocol-freeze
    paths:
      - tools/apply_phase013_review_fixes.py
      - .github/workflows/apply-phase013-review.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase0-protocol-freeze
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Apply bounded corrections
        run: python tools/apply_phase013_review_fixes.py
      - name: Remove one-time applicator
        run: |
          git rm tools/apply_phase013_review_fixes.py
          git rm .github/workflows/apply-phase013-review.yml
      - name: Stage tracked file set and regenerate manifest
        run: |
          git add -A
          python tools/build_manifest.py
          git add manifest.sha256
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Refresh recorded validation
        run: |
          python tools/validate_phase0.py | tee /tmp/phase0-validation.txt
          cp /tmp/phase0-validation.txt PHASE-0-VALIDATION.txt
          git add PHASE-0-VALIDATION.txt
          python tools/build_manifest.py
          git add manifest.sha256
      - name: Final validation
        run: |
          python -m unittest discover -s tests -v
          python tools/validate_phase0.py
          python -m compileall -q tools tests
          git diff --check
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Address remaining Codex review findings'
          git push origin HEAD:phase0-protocol-freeze
