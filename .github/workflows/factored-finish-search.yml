name: Experimental exact finish search and factored placement

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: factored-finish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned planner
        run: python -m pip install -e .
      - name: Record source and runtime
        run: |
          mkdir -p /tmp/factored-finish
          git rev-parse HEAD > /tmp/factored-finish/source-sha.txt
          python -c 'import json,platform,ortools; print(json.dumps({"python":platform.python_version(),"ortools":ortools.__version__,"platform":platform.platform()}))' > /tmp/factored-finish/runtime.json
      - name: Exact four-cell controls and independent raw enumeration
        env:
          PYTHONHASHSEED: "0"
          FACTORED_FINISH_EVIDENCE_OUTPUT: /tmp/factored-finish/results.json
        run: |
          set -euo pipefail
          python -m unittest tests.test_factored_finish_search_experiment -v 2>&1 | tee /tmp/factored-finish/tests.txt
      - name: Digest exact-head evidence
        run: |
          python -m compileall -q src/deterministic_scheduling_core/factored_finish_search_experiment.py tests/test_factored_finish_search_experiment.py
          cd /tmp/factored-finish
          sha256sum source-sha.txt runtime.json results.json tests.txt > SHA256SUMS
      - name: Upload source-bound matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factored-finish-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/factored-finish/
          if-no-files-found: warn
