name: Validate Phase 0 protocol

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase0-validation:
    name: phase0-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/phase1-ci.lock
      - name: Install hash-locked dependency environment
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements/phase1-ci.lock'
      - name: Install repository package without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Run negative guard tests
        run: python -m unittest discover -s tests -v
      - name: Validate frozen protocol
        run: python tools/validate_phase0.py
