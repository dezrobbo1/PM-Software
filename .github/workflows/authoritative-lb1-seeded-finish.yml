name: Authoritative LB1-seeded exact finish

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lb1-finish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-adoption:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded scheduler
        run: python -m pip install -e .
      - name: Capture exact checked-out source
        run: |
          mkdir -p /tmp/lb1-seeded
          git rev-parse HEAD > /tmp/lb1-seeded/source-sha.txt
      - name: Test adoption and frozen history
        env:
          PYTHONHASHSEED: '0'
        run: |
          set -euo pipefail
          python -m unittest tests.test_authoritative_lb1_seeded_finish tests.test_authoritative_canonical_batching -v 2>&1 | tee /tmp/lb1-seeded/focused-tests.txt
      - name: Compare S2/S0 source-bound controls
        env:
          PYTHONHASHSEED: '0'
        run: |
          python -m deterministic_scheduling_core.authoritative_lb1_evidence --source-sha "$(git rev-parse HEAD)" --output /tmp/lb1-seeded/result.json
          python -c 'import json,subprocess; d=json.load(open("/tmp/lb1-seeded/result.json")); assert d["source_sha"] == subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()'
      - name: Digest evidence
        if: always()
        run: |
          cd /tmp/lb1-seeded
          sha256sum source-sha.txt focused-tests.txt result.json > SHA256SUMS
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authoritative-lb1-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/lb1-seeded/
          if-no-files-found: warn
