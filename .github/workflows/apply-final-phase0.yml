name: Apply final Phase 0 review fixes

on:
  push:
    branches:
      - phase0-protocol-freeze
    paths:
      - .github/workflows/apply-final-phase0.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase0-protocol-freeze
          fetch-depth: 0

      - name: Reconstruct final source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/final4-part-* > /tmp/pm-final.tar.xz.b64
          base64 --decode /tmp/pm-final.tar.xz.b64 > /tmp/pm-final.tar.xz
          test "$(wc -c < /tmp/pm-final.tar.xz)" -eq 53528
          test "$(sha256sum /tmp/pm-final.tar.xz | cut -d' ' -f1)" = "7cf17957a7b6a12b172bdfa408456076b0a9222162383168a7e05e38ce553b42"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          xz -dc /tmp/pm-final.tar.xz | tar -xf -

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -e .

      - name: Validate final tree
        run: |
          python -m unittest discover -s tests -v
          python tools/validate_phase0.py
          python -m compileall -q tools tests
          git diff --check

      - name: Commit final repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Phase 0.1.3 review hardening"
          git push origin HEAD:phase0-protocol-freeze
