name: Experimental controlling finish lower bounds

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: finish-lower-bound-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install planner
        run: python -m pip install -e .
      - name: Record checked-out source and runtime
        run: |
          mkdir -p /tmp/finish-lower-bound
          git rev-parse HEAD > /tmp/finish-lower-bound/source-sha.txt
          python -c 'import json,platform,ortools; print(json.dumps({"python":platform.python_version(),"ortools":ortools.__version__,"platform":platform.platform()}))' > /tmp/finish-lower-bound/runtime.json
      - name: Exact lower bound validity and proof controls
        env:
          PYTHONHASHSEED: "0"
          FINISH_LB_EVIDENCE_OUTPUT: /tmp/finish-lower-bound/results.json
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python -m unittest tests.test_finish_lower_bound_experiment -v 2>&1 | tee /tmp/finish-lower-bound/tests.txt
      - name: Validate artifact provenance and digest
        run: |
          python -m compileall -q src/deterministic_scheduling_core/finish_lower_bound_experiment.py tests/test_finish_lower_bound_experiment.py
          python -c 'import json,pathlib; p=pathlib.Path("/tmp/finish-lower-bound"); assert json.loads((p/"results.json").read_text())["source_sha"] == (p/"source-sha.txt").read_text().strip()'
          cd /tmp/finish-lower-bound
          sha256sum source-sha.txt runtime.json results.json tests.txt > SHA256SUMS
      - name: Upload source-bound result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finish-lower-bound-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/finish-lower-bound/
          if-no-files-found: warn
