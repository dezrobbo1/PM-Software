name: POC smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run focused scheduling tests
        run: >-
          python -m unittest
          tests.phase1.unit.test_canonical_json_and_calendars
          tests.phase1.unit.test_kernel
          tests.phase1.unit.test_independent_validator
          tests.test_gate1_experiment
          tests.test_gate2_experiment
          tests.test_gate3_experiment
          tests.test_gate4_experiment
          tests.test_gate5_experiment
          tests.test_prototype1_workspace
          tests.test_native_project_core
          tests.test_work_method_experiment
          tests.test_trusted_state_experiment
          tests.test_objective_policy_experiment
          tests.test_adaptive_repair_experiment
          tests.test_criticality_semantics_experiment
          -v
      - name: Run Gate 1 scheduling experiment
        run: python -m deterministic_scheduling_core run-gate1-experiment
      - name: Run Gate 2 mode-choice experiment
        run: python -m deterministic_scheduling_core.gate2_experiment
      - name: Run Gate 3 operational-reality experiment
        run: python -m deterministic_scheduling_core.gate3_experiment
      - name: Run Gate 4 change-and-replanning experiment
        run: python -m deterministic_scheduling_core.gate4_experiment
      - name: Run Gate 5 real-world proof experiment
        run: python -m deterministic_scheduling_core.gate5_experiment
      - name: Run Prototype 2 native project
        run: python -m deterministic_scheduling_core.prototype2_native /tmp/pm-native-project.json
      - name: Run Work-Method-Execution falsification experiment
        run: python -m deterministic_scheduling_core.work_method_experiment
      - name: Run trusted live state falsification experiment
        run: python -m deterministic_scheduling_core.trusted_state_experiment
      - name: Run objective-policy falsification experiment
        run: python -m deterministic_scheduling_core.objective_policy_experiment
      - name: Run adaptive semantic repair falsification experiment
        run: python -m deterministic_scheduling_core.adaptive_repair_experiment
      - name: Run criticality semantics falsification experiment
        run: python -m deterministic_scheduling_core.criticality_semantics_experiment
      - name: Compile active package
        run: python -m compileall -q src
