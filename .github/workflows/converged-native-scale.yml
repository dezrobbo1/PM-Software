name: Converged native scale

on:
  push:
    branches: [main, feat/converged-native-scale-falsification]
  pull_request:

permissions:
  contents: read

concurrency:
  group: converged-native-scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scale-falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned native planner
        run: python -m pip install -e .
      - name: Record exact source and runtime
        run: |
          mkdir -p /tmp/converged-native-scale
          git rev-parse HEAD > /tmp/converged-native-scale/source-sha.txt
          python -c 'import json,platform,ortools; print(json.dumps({"python":platform.python_version(),"platform":platform.platform(),"ortools":ortools.__version__}))' > /tmp/converged-native-scale/runtime.json
      - name: Run focused scale falsification tests
        run: |
          set -euo pipefail
          python -m unittest tests.test_converged_scale_experiment -v 2>&1 | tee /tmp/converged-native-scale/tests.txt
      - name: Run converged scale experiment
        run: |
          set -euo pipefail
          python -m deterministic_scheduling_core.converged_scale_experiment --output /tmp/converged-native-scale/results.json | tee /tmp/converged-native-scale/console.txt
      - name: Compile scale sources
        run: python -m compileall -q src tests/test_converged_scale_experiment.py
      - name: Save source-bound scale evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: converged-native-scale-${{ github.sha }}
          path: /tmp/converged-native-scale/
          if-no-files-found: error
