[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-scheduling-core"
version = "0.2.1"
description = "Proof-of-concept resource-constrained scheduling experiments"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.26.0",
  "ortools==9.15.6755",
  "referencing==0.37.0",
  "rfc3339-validator==0.1.4"
]

[project.scripts]
deterministic-scheduling-core = "deterministic_scheduling_core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.dsc]
phase = "proof-of-concept"
status = "active"
implementation_started = true
